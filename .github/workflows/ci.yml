name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest "ainglish>=0.2.32"
      - run: python -m pytest -q
      - name: skill frontmatter stays portable
        run: |
          python3 - << 'PY'
          import re, sys
          allowed = {'name', 'description', 'license', 'metadata', 'allowed-tools'}
          for path in ('skills/ainglish-participate/SKILL.md', 'skills/ainglish-write/SKILL.md'):
              raw = open(path, encoding='utf-8').read()
              fm = raw.split('---')[1]
              keys = {line.split(':')[0].strip() for line in fm.strip().splitlines() if ':' in line and not line.startswith(' ')}
              bad = keys - allowed
              if bad:
                  sys.exit(f"non-portable frontmatter keys in {path}: {bad}")
              print(path, "portable:", sorted(keys))
          PY
